services:
  postgres:
    image: postgres:16-alpine
    container_name: evoroom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evoroom
      POSTGRES_PASSWORD: evoroom
      POSTGRES_DB: evoroom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evoroom -d evoroom"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: evoroom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: evoroom-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: evoroom
      MINIO_ROOT_PASSWORD: evoroomsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: evoroom-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 evoroom evoroomsecret;
      mc mb -p local/evoroom || true;
      mc mb -p local/evoroom-archive || true;
      exit 0;
      "

  livekit:
    image: livekit/livekit-server:latest
    container_name: evoroom-livekit
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      # WebRTC media (нужно для клиентов за доменом)
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  caddy:
    image: caddy:2-alpine
    container_name: evoroom-caddy
    restart: unless-stopped
    depends_on:
      - livekit
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # email для Let's Encrypt (можно переопределить)
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@evo-room.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../apps/web/dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

  livekit-egress:
    image: livekit/egress:latest
    container_name: evoroom-egress
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
      minio:
        condition: service_started
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
    # Chrome для Room Composite нужен shared memory
    shm_size: "1gb"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
